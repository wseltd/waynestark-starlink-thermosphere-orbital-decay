# PUBLIC SANITISED MANIFEST of the official NRLMSIS 2.0 / 2.1 assets.
#
# The assets themselves are NOT in this repository and are never distributed by
# it: not in src/, tests/fixtures/, data/, wheels, sdists, Docker images, Git
# LFS, release archives, review bundles or CI caches. Each user obtains the
# official package separately from the authorised NRL source and installs it
# outside the repository; the wrapper locates it through the NRLMSIS20_ROOT /
# NRLMSIS21_ROOT environment variables (names in .env.example, never values).
#
# The providers verify these hashes BEFORE every run. The two parameter files
# are the same size and msisinit performs no content validation, so a wrong or
# swapped file is physically loadable — the hash pin is what makes it refuse
# instead. A record here and the licence-policy record must agree; a mismatch
# is a refusal, not a warning.
#
# No private account information, no local paths. The private manifest with
# paths lives outside the repository.

