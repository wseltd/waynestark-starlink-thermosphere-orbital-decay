# Starlink Group 4-7 (COSPAR 2022-010) — the February 2022 event constants.
#
# This file is the authority for every event number. It exists because those
# numbers were hardcoded in a physics module, where a value and its provenance
# drift apart the moment somebody edits one and not the other, and where there
# is nowhere to put the sentence that actually matters: "0.085 m^2/kg is the
# INVERSE ballistic coefficient, and it describes the operational constellation,
# not these satellites in safe mode".
#
# CONVENTIONS, enforced by src/thermosphere_consequence/events/manifest_loader.py
# and not merely described here:
#
#   units      Every numeric value is in SI, checked by converting 1.0 of the
#              declared unit to base units and requiring the factor to be 1.
#              So: metres, not kilometres. Radians, not degrees. Tesla, not
#              nanotesla. Seconds, not hours. The conversions the reader
#              expects are therefore visible in this file rather than hidden in
#              a constant name. "count" and "dimensionless" are permitted;
#              "utc" marks a timestamp and names its timescale; "identifier"
#              marks a designator, which is a key and not a quantity.
#
#   timestamps Written as QUOTED ISO-8601 strings with an explicit offset. The
#              loader parses them, not the YAML library: PyYAML's own timestamp
#              handling has historically returned naive datetimes for offset
#              input, and a naive timestamp in a storm-onset context is
#              ambiguous by more than the event lasts. A timestamp without an
#              offset is rejected; UTC is never assumed.
#
#   provenance Every value carries source, source_url, status and authority.
#              A missing citation raises. An empty source_url is allowed ONLY
#              with a note saying why there is not one — the honest case, e.g.
#              a reference the repository holds without a DOI, has to be
#              written down rather than papered over with a plausible link.
#
#   status     observed  — recorded by an observing system or public catalogue
#              reported  — stated in a peer-reviewed paper or operator release
#              derived   — computed here from another value in this file
#              assumed   — a stated choice of this analysis, never an outcome
#
# NOT MIGRATED, deliberately:
#   SOURCES — the module's citation table is subsumed: every value below names
#   its own source, so a lookup table mapping topics to citations would be a
#   second place for the same fact to live.

schema_version: 1
event_id: starlink_group_4_7_2022
title: "Starlink Group 4-7 (COSPAR 2022-010), February 2022"

# The mode this manifest licenses. Insertion-orbit work here is a bounded
# construction from published elements, and the label below is itself checked
# against the claim gate at load time.
analysis_mode: scenario
scenario_label: >-
  Bounded insertion-orbit scenario for COSPAR 2022-010, propagated from the
  published insertion elements under stated atmosphere and drag assumptions.
  It is not a reconstruction of any spacecraft's path, carries no operator
  telemetry, and is compared against the public catalogue only for the twenty-
  one objects the catalogue ever recorded.

