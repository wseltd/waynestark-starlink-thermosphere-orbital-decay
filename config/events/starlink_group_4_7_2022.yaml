  external_reference_inverse_ballistic_coefficient:
    value: 0.085
    units: m^2/kg
    status: reported
    authority: third_party_other_vehicle
    source: >-
      Shambaugh, W. S. (2024), "Doing Battle with the Sun: Lessons From LEO and
      Operating a Satellite Constellation in the Elevated Atmospheric Drag
      Environment of Solar Cycle 25", arXiv:2406.08342 v1, p. 5. A CAPELLA
      SPACE paper. NOT SpaceX, NOT Starlink.
    source_url: "https://arxiv.org/abs/2406.08342"
    source_sha256: "c76e7848dc4c3b41f2f0d7e48a2d7001f67eecea0e32dbbd73196ffd3784c9d5"
    notes: >-
      CORRECTED 11 Sep 2026, AND RENAMED. This entry was previously called
      operator_published_inverse_ballistic_coefficient, with authority
      "operator" and the source "arXiv:2406.08342 (SpaceX constellation
      retrospective)". Every part of that was wrong, and the paper was never
      retrieved until now.

      WHOSE NUMBER IT IS. arXiv:2406.08342 is a single-author paper by
      W. S. Shambaugh about CAPELLA SPACE, which operates Synthetic Aperture
      Radar smallsats carrying large deployable wire-mesh radar reflectors. The
      0.085 figure is Capella's WHITNEY-generation satellite. It is not a
      Starlink value, it is not from the operator of these spacecraft, and it
      describes a vehicle of a different class.

      WHAT THE PAPER ACTUALLY SAYS, p. 5, verbatim: "After launch, the
      ballistic coefficient was measured by fitting modeled satellite altitude
      decay using the NRLMSISE-00 density model [10] against measured orbit
      data, resulting in ballistic coefficient C_B = 0.085 m2/kg. From the
      satellite mass and updated area estimate, this implies a coefficient of
      drag of C_d = 2.7 ... but is also 44% higher than originally estimated."

      THREE CONSEQUENCES FOR ANY USE OF IT.
      (1) It is ITSELF AN NRLMSISE-00-CONDITIONED FIT, not an independent
      measurement. Using it as an out-of-sample anchor against an MSIS-family
      model is circular, which is the opposite of what this project previously
      claimed for it.
      (2) It is an ORIENTATION AVERAGE, not an attitude-specific value. p. 4:
      "the ConOps result in a random orientation of the spacecraft to the
      airstream, the overall effective area of the spacecraft was taken to be
      the average of these faces". The previous note calling it "the
      OPERATIONAL constellation in normal flight attitude" was invented.
      (3) It is referenced to a 525 km insertion altitude, not to 210 km.

      UNITS, unchanged and still worth stating: the paper prints the symbol
      C_B with units m^2/kg, which is dimensionally C_d*A/m and NOT the
      reciprocal B = m/(C_d*A) in kg/m^2. The loader passes this name and these
      units through the claim gate, so a rename that dropped "inverse" would
      fail to load.
    module_constant: OPERATOR_FITTED_INVERSE_BALLISTIC_COEFFICIENT_M2_KG

  external_reference_ballistic_coefficient:
    value: 11.76470588235294
    units: kg/m^2
    status: derived
    authority: derived
    source: >-
      Reciprocal of external_reference_inverse_ballistic_coefficient
      (Shambaugh 2024, arXiv:2406.08342, p. 5)
    source_url: "https://arxiv.org/abs/2406.08342"
    notes: >-
      The conventional ballistic coefficient of the SAME CAPELLA SATELLITE,
      carried explicitly so a reader who wants B gets it in kg/m^2 rather than
      the reciprocal under the wrong name. It is not a Starlink quantity.
    module_constant: OPERATOR_FITTED_BALLISTIC_COEFFICIENT_KG_M2

  cd_conventional:
    value: 2.2
    units: dimensionless
    status: assumed
    authority: peer_reviewed
    source: "Cook 1965, doi:10.1016/0032-0633(65)90150-9"
    source_url: "https://doi.org/10.1016/0032-0633(65)90150-9"
    uncertainty_low: 1.8
    uncertainty_high: 3.9
    notes: >-
      Retained as a floor rather than a truth. Cook himself wrote that 2.2 "is
      subject to some uncertainty and may be too low, perhaps by as much as
      10-15 percent". The bounds are the sensitivity range the module holds as
      CD_SENSITIVITY_RANGE, and they are wider than Cook's remark because
      free-molecular C_d on adsorbed-oxygen surfaces can run considerably
      higher.
    module_constant: CD_CONVENTIONAL

