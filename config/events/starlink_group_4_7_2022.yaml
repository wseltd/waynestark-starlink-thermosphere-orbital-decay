# --- published enhancement figures --------------------------------------
# What the modelled density response is checked AGAINST. They are never used as
# inputs, and they are not this project's results.
published_enhancement:
  # ORIGINAL ALTITUDE ROWS, as each source reports them. An earlier version of
  # this section merged He et al.'s 200 km and 300 km results into single
  # 200-300 km bands, which let a linear interpolation produce "published
  # values at 210 km" that no paper states. Nothing here spans two altitudes
  # except Fang et al.'s domain range, which is explicitly not a profile.
  - reference: "Fang et al. 2022 WAM-IPE (200-400 km domain range)"
    fraction_low: 0.50
    fraction_high: 1.25
    basis: modelled
    status: reported
    authority: peer_reviewed
    source: "Fang et al. 2022, doi:10.1029/2022SW003193"
    source_url: "https://doi.org/10.1029/2022SW003193"
    notes: >-
      Abstract (p. 1) and Conclusions (p. 13): the enhancement "ranged from 50%
      to 125%, depending on location and altitude". A CONTEXTUAL RANGE OVER A
      DOMAIN, not an altitude profile: the span varies with location as well as
      height, so it states no value at 210 km and none may be read from it.
      Baseline is a 10-day model mean at the same UT.

  - reference: "Fang et al. 2022 NRLMSISE-00 (210 km)"
    fraction_low: 0.0
    fraction_high: 0.20
    basis: modelled
    status: reported
    authority: peer_reviewed
    source: "Fang et al. 2022, doi:10.1029/2022SW003193"
    source_url: "https://doi.org/10.1029/2022SW003193"
    notes: >-
      Section 4 (p. 7), Figure 5 at 210 km, 11:50 UT 4 February 2022: "MSIS-00
      only showed up to 20% enhancement in the density". The only published
      figure in this table at exactly the staging altitude, and the only one for
      the model this project runs. Reported as an upper bound, hence 0-20%.
      Quantity is the maximum of a global field at one instant; baseline is a
      10-day model mean.

  - reference: "He et al. 2023 MSIS2.0 (200 km)"
    fraction_low: 0.10
    fraction_high: 0.15
    basis: modelled
    status: reported
    authority: peer_reviewed
    source: "He et al. 2023, doi:10.1029/2023SW003521"
    source_url: "https://doi.org/10.1029/2023SW003521"
    notes: >-
      Section 3 (p. 14), Figure 9: "For MSIS2.0, it shows ~10%-15% enhancement
      during the two storm days". Global-averaged maximum of a zonal-mean field,
      relative to the 1-2 February reference days.

  - reference: "He et al. 2023 MSIS2.0 (300 km)"
    fraction_low: 0.20
    fraction_high: 0.25
    basis: modelled
    status: reported
    authority: peer_reviewed
    source: "He et al. 2023, doi:10.1029/2023SW003521"
    source_url: "https://doi.org/10.1029/2023SW003521"
    notes: >-
      Section 3 (pp. 14-15), Figure 10: "~20% and ~25% for MSIS2.0" on 3 and 4
      February. 90 km above the staging altitude. THIS PAIR WAS PREVIOUSLY
      CARRIED AS A 20-25% BAND ACROSS 200-300 km, which placed the supposed
      published value at 210 km near 20.5%; the source supports no such figure.

  - reference: "He et al. 2023 CTIPe/MAGE model average (200 km)"
    fraction_low: 0.35
    fraction_high: 0.35
    basis: modelled
    status: reported
    authority: peer_reviewed
    source: "He et al. 2023, doi:10.1029/2023SW003521"
    source_url: "https://doi.org/10.1029/2023SW003521"
    notes: >-
      Section 3 (p. 15): "the global averaged maximum density enhancement based
      on the average value of both the CTIPe and the MAGE models, which can be
      up to ~35% at 200 and ~60% at 300 km during the two storm days". THREE
      averaging operations: over MODELS (two), over SPACE (zonal then global
      mean), maximised over TIME (the two storm days). Single reported value,
      hence equal bounds. CORRECTED ATTRIBUTION: this figure was credited to
      "Girgis et al. 2023 (Space Weather Starlink collection)" with no DOI and a
      basis of "modelled+observed"; all three were wrong.

  - reference: "He et al. 2023 CTIPe/MAGE model average (300 km)"
    fraction_low: 0.60
    fraction_high: 0.60
    basis: modelled
    status: reported
