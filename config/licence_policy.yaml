# Licence and data policy for thermosphere-consequence.
#
# THE machine-checked register. src/thermosphere_consequence/licence reads this
# file; tests/licence/test_licence_policy.py enforces it; the production gate
# refuses anything it does not find here.
#
# ---------------------------------------------------------------------------
# The one distinction this file exists to preserve
# ---------------------------------------------------------------------------
# `classification` and `commercial_use` record a FACT about somebody else's
# licence. `policy_decision` records a CHOICE this project made. They are not
# the same statement and they diverge in both directions:
#
#   ADBSat (GPL-3.0) and Nyx (AGPL-3.0) — their licences PERMIT commercial use
#   under copyleft obligations. This project declines the obligations, so they
#   are `excluded_by_policy`. Calling them "prohibited" would be a false claim
#   about a licence the project does not own.
#
#   NRLMSIS 2.x, DTM2020, SET HASDM, WDC Kyoto indices and the TU Delft
#   aerodynamic models — their licences DO forbid commercial use, so they are
#   `prohibited_by_licence`. Recording that as a policy preference would let a
#   later reviewer "relax the policy" and ship a licence breach.
#
#   NRLMSIS 2.0/2.1 and its parameter files are additionally
#   `licence_pending`: a written question to NRL — non-revenue open research
#   through WSE Limited, an independent Apache-2.0 wrapper carrying no NRL
#   material, publication of derived figures and small reproducibility tables —
#   is outstanding and UNANSWERED. That is not a softer status than
#   `prohibited_by_licence`; it is a harder one. The gate refuses a pending
#   record in EVERY mode, including research, because permission must not be
#   inferred from silence.
#
#   NRLMSISE-00 is a fourth case again, and the opposite kind of gap. The
#   Fortran this project actually compiles — NRLMSISE-00.FOR, fetched from NRL
#   at build time by pymsis — carries NO licence text of any kind: no copyright
#   notice, no public-domain dedication, no terms, and no restriction either.
#   That is an ABSENCE OF TERMS, which is not a grant and is equally not a
#   prohibition. Its `commercial_use` is therefore `unknown` and its decision is
#   `permitted_research_only`: run in research, REFUSED in production, pending
#   primary evidence. See third_party/licences/NRLMSISE-00-PROVENANCE.md.
#
# The loader enforces the invariants, so the distinction cannot decay into a
# naming convention:
#
#   policy_decision in {"prohibited_by_licence", "licence_pending"}
#                                               <=>  commercial_use == "prohibited"
#   classification  == "red"                    <=>  commercial_use == "prohibited"
#   classification  == "green"                   =>  commercial_use == "permitted"
#
#   policy_decision == "permitted_research_only" <=>  commercial_use == "unknown"
#   policy_decision == "permitted_research_only"  =>  classification == "amber"
#   policy_decision == "permitted_research_only"  =>  verification_gap populated
#   policy_decision == "permitted"                =>  verification_gap absent
#
#   policy_decision == "licence_pending"         =>  fail_closed: true AND a
#                                                    pending_request whose
#                                                    reply_received is false
#
# A pending_request that records reply_received: true must carry a reply_scope
# saying what the reply actually covered, and the record may no longer be
# `licence_pending`: the reply forces an explicit re-decision.
#
# `verification_gap` is what makes `permitted_research_only` dischargeable: it
# names the evidence that is missing and what would close it. A record that said
# "research only" without it would be a status nobody could ever lift. The
# mirror rule — a `permitted` record may not carry one — is what stops
# production running on terms that are still outstanding.
#
# ---------------------------------------------------------------------------
# classification vocabulary (the licence FACT)
# ---------------------------------------------------------------------------
#   green  commercial use permitted, no material obligation beyond attribution
#          or a NOTICE file
#   amber  commercial use permitted but under a material condition: copyleft, a
#          no-modification clause, per-user credentials, redistribution limits,
#          or terms this project has not verified
#   red    the licence does not permit commercial use
#
# ---------------------------------------------------------------------------
# Sources of the determinations
# ---------------------------------------------------------------------------
# open-source-toolchain-1.md sections A1-A8 and TABLES 1, 2, 7, 8, together
# with planning/registry/resources.yaml and the blockers named in
# planning/registry/blockers.yaml. Every record carries the primary URL that
# evidences it. No determination in this file was written from memory.
#
# Adding a resource is a licence decision: record it here, with evidence, and
# add it to third_party/software_manifest.yaml or third_party/data_manifest.yaml
# before any code names it.

policy_version: "1.0.0"

# Strict-permissive allowlist. SPDX identifiers where the licence is on the
# SPDX list; a LicenseRef- identifier where it is not, which is SPDX's own
# convention for an unlisted licence rather than an invention of this project.
#
# Being on this list is not sufficient for `policy_decision: permitted` and is
# not necessary either: JB2008, CelesTrak and Space-Track are permitted under
# their own bespoke terms with conditions recorded per record.
permissive_allowlist:
  - "Apache-2.0"
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "ISC"
  - "MIT"
  - "PSF-2.0"
  - "CC0-1.0"
  - "CC-BY-4.0"
  - "Unlicense"
  - "LicenseRef-PublicDomain"
  - "LicenseRef-US-Gov-Public-Domain"
  - "LicenseRef-Matplotlib"

# Licences that DO permit commercial use and that this project nonetheless
# declines, because of the obligations they attach. A record carrying one of
# these may not be `permitted` — the loader fails the load if it is.
#
# Non-commercial licences (CC-BY-NC-SA-4.0, the NRL and CNES academic terms)
# are deliberately NOT listed here: they are excluded by the licence itself,
# not by this project's policy, and mixing the two lists would re-create the
# confusion this file exists to prevent.
excluded_licences:
  - "AGPL-3.0-only"
  - "AGPL-3.0-or-later"
  - "GPL-2.0-only"
  - "GPL-2.0-or-later"
  - "GPL-3.0-only"
  - "GPL-3.0-or-later"
  - "LGPL-3.0-only"
  - "LGPL-3.0-or-later"
  - "MPL-2.0"
  - "SSPL-1.0"

modes:
  production:
    description: >-
      The commercial deliverable: shipped code, hosted inference, and any
      artefact a customer sees. Admits only policy_decision 'permitted'. This
      set is an invariant enforced by the loader, not a configurable value: a
      production mode that admitted 'excluded_by_policy' or
      'prohibited_by_licence' would ship exactly what the audit refused.
    allowed_policy_decisions: ["permitted"]
  research:
    description: >-
      Internal, non-commercial, non-shipping work: validation against
      academically licensed models, cross-checks against research-only
      datasets, and comparisons run under copyleft tools kept as separate
      executables. Admits every declared record that is not frozen, because
      that is what the academic and copyleft licences themselves permit, and
      because a resource whose terms have not been located at all
      ('permitted_research_only') raises no commercial question in a mode that
      makes no commercial use. A result obtained in this mode must never be
      published from a production build, and an UNDECLARED resource is still
      refused here.
    allowed_policy_decisions:
      ["permitted", "permitted_research_only", "excluded_by_policy",
       "prohibited_by_licence"]
  open_noncommercial_research:
    description: >-
      The research mode for work that will be OPENLY PUBLISHED and is
      non-commercial: the NRLMSIS 2.x Starlink reanalysis. Everything the
      research mode admits, PLUS records carrying
      'research_noncommercial_open_publication_permitted' - the decision that
      records a written rights-holder confirmation for exactly this kind of
      use. That decision appears in no other mode's table, so the confirmed
      resources are refused everywhere else by construction, including in
      research mode: the confirmation covers the described open-publication
      workflow, and quiet internal use under a broader mode would outrun its
      scope.
    allowed_policy_decisions:
      ["permitted", "permitted_research_only", "excluded_by_policy",
       "prohibited_by_licence", "research_noncommercial_open_publication_permitted"]

# Where a refused resource has a lawful replacement, name it. The loader
# requires every substitute to be a declared resource that is itself usable —
# 'permitted' or 'permitted_research_only', and not frozen — so the gate can
# never point a caller at a resource this project declines or is barred from.
# That is NOT the same as "any substitute will do": a substitute must also be
# admitted by the MODE being asked about, and where it is not, the refusal says
# so and names the verification gap rather than sending the caller onward to a
# second refusal. nrlmsise00 is exactly that case — a real substitute in
# research, and no substitute at all in production.
# Resources whose replacement is this project's own implementation
# (ADBSat -> in-house Sentman; Nyx -> in-house propagator) record that in
# policy_reason instead, because an in-house module is not a third-party
# resource.
substitutes:
  nrlmsis_2_0: nrlmsise00
  nrlmsis_2_1: nrlmsise00
  msis20_parm: nrlmsise00
  msis21_parm: nrlmsise00
  dtm2020: nrlmsise00
  hasdm: tudelft_grace_fo
  wdc_kyoto_symh: nasa_omni
  f107_nrcan: celestrak

