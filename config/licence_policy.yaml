    modification_permitted: "unknown"
    credential_required: false
    legal_review_required: true
    notice_required: false
    attribution_text: >-
      NRLMSISE-00 empirical atmosphere model, Picone et al. (2002),
      doi:10.1029/2002JA009430. US Naval Research Laboratory. Licence terms not
      located; used for open non-commercial research only.
    classification: "amber"
    policy_decision: "permitted_research_only"
    verification_gap: >-
      No primary licence evidence is held for the artefact this project actually
      compiles. NRLMSISE-00.FOR, fetched from NRL at build time by pymsis
      (tools/download_source.py; pymsis vendors no MSIS-00 source, src/msis00/
      holds only a .gitkeep), carries NO licence text of any kind: a full-text
      search for licen, copyright, public domain, restrict, proprietar,
      distribut and permission returns ONE hit, at line 291, and it is not a
      licence statement. Three things would close this, any one of them: (1) a
      primary public-domain dedication or terms-of-use page published by NRL for
      the NRLMSISE-00 Fortran distribution specifically, filed under
      third_party/licences/; (2) written confirmation from NRL — the outstanding
      NRLMSIS 2.x request is a natural place to add the question, but it does NOT
      currently cover this model and must not be treated as if it does; (3) a
      reasoned 17 U.S.C. 105 determination signed off by someone competent to
      make it, recorded as a legal determination rather than asserted in YAML.
      Tracked as BLK-NRLMSISE00-ARTEFACT-PROVENANCE.
    policy_reason: >-
      RESEARCH ONLY. This is an ABSENCE OF TERMS, not a restriction: nothing
      forbidding use was found, and nothing granting it either. An absence of
      terms is not a grant, so the artefact may not enter the production path
      until primary evidence is filed. It remains this project's PRIMARY
      composition engine in research mode and the recorded substitute for the
      restricted thermosphere models — a substitute that research mode admits
      and production does not, which the gate states rather than glossing.
      This record previously cited COPYING.NRLMSISE-00 from st-bender/pynrlmsise00
      as its grant; that file is real but accompanies a DIFFERENT artefact,
      Dominik Brodowski's independent C port, not the NRL Fortran compiled here.
      Citing it was a provenance error and is corrected here. NOT covered by the
      outstanding NRLMSIS 2.x request: this is a different model under different
      terms, and the pending NRL question must not be read as reaching it in
      either direction.
    evidence_url: "third_party/licences/NRLMSISE-00-PROVENANCE.md"
    note: >-
      Reached through pymsis in MSISE-00 mode (version=0). Do not confuse with
      NRLMSIS 2.x, which is a different model under different terms and is
      FROZEN. Primary evidence for this record is held in-repo:
      third_party/licences/NRLMSISE-00-PROVENANCE.md records the retrieval and
      the finding, and third_party/licences/NRLMSISE-00.FOR.header-evidence.txt
      retains the first 300 lines of the source so the finding can be re-checked
      without re-fetching. Production mode consequently has NO atmosphere
      provider at all; that is the honest consequence of this project being open
      non-commercial research, not a defect. See
      evidence/NRLMSIS_LICENCE_FREEZE.md.

