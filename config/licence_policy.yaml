      reply_utc: "2026-08-23T00:00:00+00:00"
      reply_scope: >-
        WRITTEN REPLY, relayed verbatim by the operator (reply_utc is the date
        the reply was entered in this register, same convention as
        requested_utc; permission_basis is
        operator_confirmed_written_nrl_permission, and the correspondence
        itself is intentionally_not_stored_by_project). Operative text: "The developer got back with me and said, 'I have no issues permitting this use - this is exactly the kind of academic use we wanted the primary license to permit.' Therefore, you can proceed with utilizing this invention under the terms of the license agreement." The reply
        answers an email that expressly described: research through Waynestark
        Enterprises Limited (a UK commercial legal entity) that is strictly
        non-commercial, not customer-funded, not a paid product or service,
        with no revenue intended; open publication; original methodology and
        original source code on public GitHub; use of NRLMSIS 2.0 and 2.1; an
        independently written wrapper with no NRL source, no translated
        routines, no NRL coefficient or parameter files and no modification of
        the official implementation; separate per-user installation from the
        authorised NRL source; Apache-2.0 applying ONLY to original wrapper
        and analysis code; publication limited to model-generated numerical
        results, figures, discussion, small derived tables, version
        identifiers, hashes, configuration and provenance; and no
        redistribution, translation, modification, relicensing or bundling of
        NRL material. "Under the terms of the license agreement" is
        CONTROLLING: this is permission for the described use under the
        existing licence, not a waiver of it. It covers NRLMSIS 2.0 and 2.1
        ONLY; it says nothing about NRLMSISE-00, HWM14, DTM2020, JB2008 or any
        other model.
