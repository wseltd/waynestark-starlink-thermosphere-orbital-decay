    source_url: "https://map.nrl.navy.mil/map/pub/nrl/NRLMSIS/NRLMSISE-00/NRLMSISE-00.FOR"
    version: >-
      2000 reference model (Picone et al. 2002); artefact NRLMSISE-00.FOR
      retrieved 2026-08-16, HTTP 200, 114,981 bytes, sha256
      cce0420e90781c256bc6705c4cc8056b054812d6308adccb7081bf09af0d44cb,
      compiled into the msis00f extension this project loads
    commercial_use: "unknown"
    saas_use: "unknown"
