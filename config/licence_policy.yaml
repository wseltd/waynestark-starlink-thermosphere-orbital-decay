# ---------------------------------------------------------------------------
# Per-variable data licences
# ---------------------------------------------------------------------------
# A dataset-level permission does not clear every variable inside it. Two cases
# in this project force the distinction:
#
#   NASA OMNI is US-Government open data, but SYM-H, ASY-H and AE inside the
#   aggregation are Kyoto-DERIVED, and WDC Kyoto forbids commercial use of the
#   indices. Whether NASA's terms cover the derived fields in full is an OPEN
#   QUESTION (BLK-OMNI-KYOTO-FIELDS). It is recorded here as `conditional`
#   with the condition written down. Asserting either answer would be inventing
#   a legal determination.
#
#   TU Delft publishes CC BY 4.0 density DATA and CC BY-NC-SA 4.0 aerodynamic
#   MODELS from the same portal.
#
# substitute_variable resolves as "dataset.variable", or as a bare variable
# name within the same dataset, and must itself be production-allowed.
data_fields:

  - dataset: gfz_kp_ap
    variable_name: "Kp"
    licence: "CC-BY-4.0"
    commercial_use: "permitted"
    production_allowed: true
    substitute_variable: null
    note: "Definitive for February 2022. Production geomagnetic driver."

  - dataset: gfz_kp_ap
    variable_name: "ap"
    licence: "CC-BY-4.0"
    commercial_use: "permitted"
    production_allowed: true
    substitute_variable: null
    note: "The NRLMSISE-00 geomagnetic driver, and the lawful storm index for production."

  - dataset: nasa_omni
    variable_name: "BZ_GSM"
    licence: "LicenseRef-US-Gov-Public-Domain"
    commercial_use: "permitted"
    production_allowed: true
    substitute_variable: null
    note: "NASA-produced IMF variable; not Kyoto-derived."

  - dataset: nasa_omni
    variable_name: "flow_speed"
    licence: "LicenseRef-US-Gov-Public-Domain"
    commercial_use: "permitted"
    production_allowed: true
    substitute_variable: null
    note: "NASA-produced solar-wind variable; not Kyoto-derived."

  - dataset: nasa_omni
    variable_name: "proton_density"
    licence: "LicenseRef-US-Gov-Public-Domain"
    commercial_use: "permitted"
    production_allowed: true
    substitute_variable: null
    note: "NASA-produced solar-wind variable; not Kyoto-derived."

  - dataset: nasa_omni
    variable_name: "SYM_H"
    licence: "LicenseRef-US-Gov-Public-Domain aggregation of a Kyoto-derived index"
    commercial_use: "conditional"
    production_allowed: false
    substitute_variable: "gfz_kp_ap.ap"
    note: >-
      OPEN QUESTION (BLK-OMNI-KYOTO-FIELDS). NASA republishes SYM-H as
      US-Government open data, but the index itself is derived by WDC Kyoto,
      whose terms forbid commercial applications of the geomagnetic indices.
      Whether the NASA aggregation clears the derived field in full is not
      resolved, so it is excluded from production rather than assumed either
      way. Research use is permitted; the production physics uses GFZ ap.

  - dataset: nasa_omni
    variable_name: "ASY_H"
    licence: "LicenseRef-US-Gov-Public-Domain aggregation of a Kyoto-derived index"
    commercial_use: "conditional"
    production_allowed: false
    substitute_variable: "gfz_kp_ap.ap"
    note: >-
      OPEN QUESTION (BLK-OMNI-KYOTO-FIELDS), identical in kind to SYM_H:
      Kyoto-derived inside a NASA aggregation, unresolved, therefore excluded
      from production rather than assumed either way.

  - dataset: nasa_omni
    variable_name: "AE_INDEX"
    licence: "LicenseRef-US-Gov-Public-Domain aggregation of a Kyoto-derived index"
    commercial_use: "conditional"
    production_allowed: false
    substitute_variable: "gfz_kp_ap.ap"
    note: >-
      OPEN QUESTION (BLK-OMNI-KYOTO-FIELDS). The AE index is WDC Kyoto
      provisional for 2022 and reaches OMNI through the same aggregation route
      as SYM-H, so it carries the same unresolved condition.

  - dataset: wdc_kyoto_symh
    variable_name: "Dst"
    licence: "LicenseRef-WDC-Kyoto-NonCommercial"
    commercial_use: "prohibited"
    production_allowed: false
    substitute_variable: "gfz_kp_ap.ap"
    note: >-
      Development cross-check only. The like-for-like substitute is OMNI SYM-H,
      but that variable carries its own unresolved condition, so the production
      substitute recorded here is the GFZ ap index.

  - dataset: wdc_kyoto_symh
    variable_name: "SYM_H"
    licence: "LicenseRef-WDC-Kyoto-NonCommercial"
    commercial_use: "prohibited"
    production_allowed: false
    substitute_variable: "gfz_kp_ap.ap"
    note: >-
      Commercial applications of the Kyoto indices are not permitted by the
      publisher. There is no code path from this project to a Kyoto endpoint.

  - dataset: wdc_kyoto_symh
    variable_name: "AE"
    licence: "LicenseRef-WDC-Kyoto-NonCommercial"
    commercial_use: "prohibited"
    production_allowed: false
    substitute_variable: "gfz_kp_ap.ap"
    note: "Provisional for 2022 and non-commercial; excluded from the production path."

  - dataset: tudelft_grace_fo
    variable_name: "density"
    licence: "CC-BY-4.0"
    commercial_use: "permitted"
    production_allowed: true
    substitute_variable: null
    note: "Accelerometer-derived neutral density at about 490-505 km. DATA, CC BY 4.0."

